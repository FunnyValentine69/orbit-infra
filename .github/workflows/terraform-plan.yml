# terraform-plan
#
# Runs the policy gates (validate/lint/test, via scripts/gates.sh) on every
# pull request. Secret-bearing LocalStack and Infracost jobs run only for the
# repository owner's own same-repository pull requests. No AWS credentials
# of any kind are used anywhere in this workflow -- pull
# requests never trust an OIDC subject that any real-AWS role would honor
# (ADR 0005), so PR-triggered plans run against LocalStack instead
# (ADR 0008). Real-AWS plans are a `main`-only, human-triggered action
# outside this workflow.
#
# Secret-bearing PR jobs run only for the repository owner's own same-repository
# pull requests. The static gates remain safe for every trigger.

name: terraform-plan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read terraform version from tools.lock
        id: tf-version
        run: echo "version=$(scripts/tool-version.sh terraform)" >> "$GITHUB_OUTPUT"

      - name: Read tflint version from tools.lock
        id: tflint-version
        run: echo "version=$(scripts/tool-version.sh tflint)" >> "$GITHUB_OUTPUT"

      - name: Read checkov version from tools.lock
        id: checkov-version
        run: echo "version=$(scripts/tool-version.sh checkov)" >> "$GITHUB_OUTPUT"

      - name: Read conftest version from tools.lock
        id: conftest-version
        run: echo "version=$(scripts/tool-version.sh conftest)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v${{ steps.tflint-version.outputs.version }}

      - name: Install checkov
        run: pip install checkov==${{ steps.checkov-version.outputs.version }}

      - name: Install conftest
        env:
          CONFTEST_VERSION: ${{ steps.conftest-version.outputs.version }}
        run: |
          version="$CONFTEST_VERSION"
          archive="conftest_${version}_Linux_x86_64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/open-policy-agent/conftest/releases/download/v${version}/${archive}"
          expected="$(scripts/tool-ci-digest.sh conftest)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "conftest archive checksum mismatch" >&2
            exit 1
          fi
          tar -xzf "$archive" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version

      - name: tflint --init
        run: tflint --init

      - name: Run gates
        env:
          GATES_POLICY_SIZE: skip
        run: scripts/gates.sh

  plan-localstack:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read terraform version from tools.lock
        id: tf-version
        run: echo "version=$(scripts/tool-version.sh terraform)" >> "$GITHUB_OUTPUT"

      - name: Read conftest version from tools.lock
        id: conftest-version
        run: echo "version=$(scripts/tool-version.sh conftest)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Install conftest
        env:
          CONFTEST_VERSION: ${{ steps.conftest-version.outputs.version }}
        run: |
          version="$CONFTEST_VERSION"
          archive="conftest_${version}_Linux_x86_64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/open-policy-agent/conftest/releases/download/v${version}/${archive}"
          expected="$(scripts/tool-ci-digest.sh conftest)"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "conftest archive checksum mismatch" >&2
            exit 1
          fi
          tar -xzf "$archive" conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version

      - name: Start LocalStack
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: '2026.8'
          install-awslocal: 'true'
          use-pro: 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: Wait for LocalStack health
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time" >&2
          exit 1

      - name: Conftest policy gate on the bootstrap plan
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          TF_DATA_DIR: .terraform-localstack
        run: |
          cleanup() {
            rm -f bootstrap/backend_override.tf /tmp/bootstrap.tfplan
          }
          trap cleanup EXIT
          cp bootstrap/localstack.backend_override.tf.example bootstrap/backend_override.tf
          env -u AWS_PROFILE -u AWS_SESSION_TOKEN -u AWS_SECURITY_TOKEN terraform -chdir=bootstrap init -reconfigure -input=false
          env -u AWS_PROFILE -u AWS_SESSION_TOKEN -u AWS_SECURITY_TOKEN terraform -chdir=bootstrap plan -input=false -out=/tmp/bootstrap.tfplan -var "target=localstack" -var budget_email=unused
          env -u AWS_PROFILE -u AWS_SESSION_TOKEN -u AWS_SECURITY_TOKEN terraform -chdir=bootstrap show -json /tmp/bootstrap.tfplan > /tmp/bootstrap-plan.json
          conftest test --policy policy/ /tmp/bootstrap-plan.json
          cleanup
          trap - EXIT

      - name: Apply bootstrap (LocalStack)
        run: make bootstrap-apply TARGET=localstack

      - name: Check bootstrap IAM policy sizes
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          POLICY_SIZE_PLAN_JSON_OUT: /tmp/bootstrap-plan-post-apply.json
        run: bootstrap/policy-size-check.sh

      - name: Check IAM matrix against post-apply plan
        run: bash tests/iam-matrix-contracts.sh /tmp/bootstrap-plan-post-apply.json

      # CI builds this placeholder image for the runner's native arch
      # (amd64); local development on Apple Silicon builds arm64. Both
      # are throwaway images for LocalStack ECS scheduling only -- P3-3
      # replaces this with the real application image.
      - name: Build placeholder image
        run: docker build -t placeholder:local placeholder/

      - name: Terraform plan (LocalStack)
        env:
          # RFC 1918 placeholder from the plan; never an operator address.
          OPERATOR_CIDR: 10.255.255.255/32
          TF_CLI_ARGS_plan: -out=tfplan.bin
        run: |
          make plan TARGET=localstack ENV_ID=pr${{ github.event.pull_request.number || 'dispatch' }} | tee /tmp/plan-stdout.txt

      - name: Redacted plan summary
        env:
          ENV_ID: pr${{ github.event.pull_request.number || 'dispatch' }}
        run: |
          preview_root=".preview-runs/${ENV_ID}"
          TF_DATA_DIR=.terraform-localstack terraform -chdir="$preview_root" show -json tfplan.bin > /tmp/plan.json
          {
            echo "### Terraform plan (LocalStack)"
            echo ""
            echo '```'
            jq -r '.resource_changes[] | .address + " " + (.change.actions | join(","))' /tmp/plan.json
            echo '```'
            echo ""
            grep -E '^Plan: ' /tmp/plan-stdout.txt || true
          } | sed -E 's/[0-9]{12}/************/g' > /tmp/plan-summary.md
          cat /tmp/plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Conftest policy gate on the LocalStack plan
        run: conftest test --policy policy/ /tmp/plan.json

      - name: Remove local plan file
        if: always()
        env:
          ENV_ID: pr${{ github.event.pull_request.number || 'dispatch' }}
        run: rm -f ".preview-runs/${ENV_ID}/tfplan.bin"

      - name: Post or update PR plan comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- terraform-plan -->'
          body_file=/tmp/plan-comment.md
          dispatch_env_id="$(printf 'pr%s' "$PR_NUMBER" | cut -c1-12)"
          {
            echo "$marker"
            echo ""
            cat /tmp/plan-summary.md
            printf 'Post-merge dispatch: `gh workflow run session-apply.yml --ref main -f env_id=%s -f target=aws -f mode=public`; LocalStack: `gh workflow run session-apply.yml --ref main -f env_id=%s -f target=localstack -f mode=public`\n' "$dispatch_env_id" "$dispatch_env_id"
          } > "$body_file"
          existing_id=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${existing_id}" -F body=@"$body_file"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -F body=@"$body_file"
          fi

  infracost:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for Infracost API key
        id: check
        run: echo "has_key=${{ secrets.INFRACOST_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.has_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Infracost
        if: steps.check.outputs.has_key == 'true'
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Write temporary tfvars
        if: steps.check.outputs.has_key == 'true'
        run: |
          cat > /tmp/infracost.tfvars <<'EOF'
          env_id = "pr"
          # RFC 1918 placeholder from the plan; never an operator address.
          operator_cidr = "10.255.255.255/32"
          target = "aws"
          EOF

      - name: Infracost breakdown
        if: steps.check.outputs.has_key == 'true'
        run: |
          infracost breakdown --path envs/preview --terraform-var-file /tmp/infracost.tfvars --format json --out-file /tmp/infracost.json

      - name: Infracost PR comment
        if: steps.check.outputs.has_key == 'true' && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          infracost comment github --path /tmp/infracost.json --repo "$GITHUB_REPOSITORY" --pull-request ${{ github.event.pull_request.number }} --github-token "$GITHUB_TOKEN" --behavior update

      - name: Append monthly total to step summary
        if: steps.check.outputs.has_key == 'true'
        run: |
          total=$(jq -r '.totalMonthlyCost' /tmp/infracost.json)
          {
            echo "### Infracost monthly total"
            echo ""
            echo "\$${total}/month"
          } >> "$GITHUB_STEP_SUMMARY"
