# session-apply
#
# Human-triggered, main-only apply of a preview environment against real
# AWS (ADR 0006). Assumes AWS_ROLE_DEPLOYER, which trusts only the
# `ref:refs/heads/main` OIDC subject (bootstrap/roles.tf) -- this
# workflow cannot run from any other ref, matching that trust policy.
#
# Apply order per ADR 0006: runner-CIDR rejection check -> lint+checkov
# (scripts/gates.sh) -> lease open (CAS) -> plan/apply -> negative
# ingress test. Static-gate failures never create a lease or resources.
# Any failure after the lease exists runs scripts/close-env.sh (stage 1
# of close) so a crashed apply never orphans billable resources.
#
# Per ADR 0006 / ARCHITECTURE.md, apply, destroy, and the sweeper share
# the `preview-<env_id>` concurrency group so they never overlap.

name: session-apply

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: 'Preview environment id matching Terraform (1-12 chars)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: preview-${{ inputs.env_id }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-input:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate env_id
        env:
          ENV_ID: ${{ inputs.env_id }}
        run: |
          if ! printf '%s' "$ENV_ID" | grep -qE '^[a-z0-9]([a-z0-9-]{0,10}[a-z0-9])?$'; then
            echo "env_id '$ENV_ID' does not match ^[a-z0-9]([a-z0-9-]{0,10}[a-z0-9])?\$" >&2
            exit 1
          fi

  runner-cidr-check:
    needs: validate-input
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject if runner IP is inside the operator CIDR
        env:
          OPERATOR_CIDR: ${{ secrets.OPERATOR_CIDR }}
        run: |
          runner_ip=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')
          if [ -z "$OPERATOR_CIDR" ]; then
            echo "OPERATOR_CIDR repository secret is unset" >&2
            exit 1
          fi
          python3 - "$runner_ip" "$OPERATOR_CIDR" <<'EOF'
          import ipaddress
          import sys

          runner_ip, operator_cidr = sys.argv[1], sys.argv[2]
          if ipaddress.ip_address(runner_ip) in ipaddress.ip_network(operator_cidr, strict=False):
              print("runner IP falls inside the operator CIDR; refusing to run", file=sys.stderr)
              sys.exit(1)
          EOF

  gates:
    needs: runner-cidr-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read terraform version from tools.lock
        id: tf-version
        run: echo "version=$(grep '^terraform ' tools.lock | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Read tflint version from tools.lock
        id: tflint-version
        run: echo "version=$(grep '^tflint ' tools.lock | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Read checkov version from tools.lock
        id: checkov-version
        run: echo "version=$(grep '^checkov ' tools.lock | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v${{ steps.tflint-version.outputs.version }}

      - name: Install checkov
        run: pip install checkov==${{ steps.checkov-version.outputs.version }}

      - name: tflint --init
        run: tflint --init

      - name: Lint + checkov (validate/lint minus test)
        run: |
          make validate
          make lint

  apply:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (deployer)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOYER }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Read terraform version from tools.lock
        id: tf-version
        run: echo "version=$(grep '^terraform ' tools.lock | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.version }}
          terraform_wrapper: false

      - name: Write AWS backend config
        run: scripts/write-preview-backend.sh

      - name: Read deployable image digests
        id: images
        run: |
          api_repository="orbit-infra-79s5rw/orbit-api"
          api_digest="$(awk -v repository="$api_repository" '
            $1 == repository ":" { in_repository = 1; next }
            in_repository && $1 == "digest:" { print $2; exit }
          ' upstream.lock)"
          redis_repository="$(awk '$1 == "redis_repository:" { print $2 }' mirror-images.lock)"
          redis_digest="$(awk '$1 == "redis_digest:" { print $2 }' mirror-images.lock)"
          clickhouse_repository="$(awk '$1 == "clickhouse_repository:" { print $2 }' mirror-images.lock)"
          clickhouse_digest="$(awk '$1 == "clickhouse_digest:" { print $2 }' mirror-images.lock)"

          for digest in "$api_digest" "$redis_digest" "$clickhouse_digest"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "an image lock contains a missing or invalid digest" >&2
              exit 1
            fi
          done
          if [[ "$redis_repository" != "orbit-infra-79s5rw/mirror/redis" ]] || \
             [[ "$clickhouse_repository" != "orbit-infra-79s5rw/mirror/clickhouse" ]]; then
            echo "mirror repository names do not match bootstrap/ecr.tf" >&2
            exit 1
          fi

          {
            echo "api_digest=${api_digest}"
            echo "redis_digest=${redis_digest}"
            echo "clickhouse_digest=${clickhouse_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Open lease
        env:
          ENV_ID: ${{ inputs.env_id }}
          TARGET: aws
        run: scripts/lease.sh open "$ENV_ID"

      - name: Terraform plan (AWS)
        env:
          OPERATOR_CIDR: ${{ secrets.OPERATOR_CIDR }}
          ENV_ID: ${{ inputs.env_id }}
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          REDIS_DIGEST: ${{ steps.images.outputs.redis_digest }}
          CLICKHOUSE_DIGEST: ${{ steps.images.outputs.clickhouse_digest }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account_id}"
          registry="${account_id}.dkr.ecr.us-east-1.amazonaws.com"
          export TF_VAR_api_image="${registry}/orbit-infra-79s5rw/orbit-api@${API_DIGEST}"
          export TF_VAR_redis_image="${registry}/orbit-infra-79s5rw/mirror/redis@${REDIS_DIGEST}"
          export TF_VAR_clickhouse_image="${registry}/orbit-infra-79s5rw/mirror/clickhouse@${CLICKHOUSE_DIGEST}"
          make plan TARGET=aws ENV_ID="$ENV_ID"

      - name: Terraform apply (AWS)
        env:
          OPERATOR_CIDR: ${{ secrets.OPERATOR_CIDR }}
          ENV_ID: ${{ inputs.env_id }}
        run: make apply TARGET=aws ENV_ID="$ENV_ID"

      - name: Remove saved plan
        if: always()
        run: rm -f envs/preview/tfplan.bin

      - name: Wait up to 10 minutes for every ECS service
        run: |
          cluster_arn="$(terraform -chdir=envs/preview output -raw ecs_cluster_arn)"
          services=()
          for output_name in api_service_name redis_service_name clickhouse_service_name worker_service_name; do
            service_name="$(terraform -chdir=envs/preview output -raw "$output_name" 2>/dev/null || true)"
            if [[ -n "$service_name" && "$service_name" != "null" ]]; then
              services+=("$service_name")
            fi
          done
          if (( ${#services[@]} < 3 )); then
            echo "fewer than the three required ECS services were present in Terraform outputs" >&2
            exit 1
          fi

          listed_services="$(aws ecs list-services --cluster "$cluster_arn" --output json)"
          for service_name in "${services[@]}"; do
            if ! jq -e --arg service_name "$service_name" \
              'any(.serviceArns[]; endswith("/" + $service_name))' <<< "$listed_services" >/dev/null; then
              echo "enabled ECS service $service_name is absent from list-services" >&2
              exit 1
            fi
          done

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            response="$(aws ecs describe-services --cluster "$cluster_arn" --services "${services[@]}")"
            failures="$(jq -c '.failures // []' <<< "$response")"
            if [[ "$failures" != "[]" ]]; then
              echo "ECS describe-services returned failures: $failures" >&2
              exit 1
            fi
            unstable="$(jq -c '[.services[] | select(.runningCount != .desiredCount)]' <<< "$response")"
            if [[ "$unstable" == "[]" ]]; then
              echo "all ${#services[@]} ECS services reached runningCount == desiredCount"
              break
            fi
            echo "waiting for ECS services: $unstable"
            sleep 15
          done

          if [[ "$unstable" != "[]" ]]; then
            echo "ECS services did not reach runningCount == desiredCount within 10 minutes: $unstable" >&2
            exit 1
          fi

      - name: Negative ingress test (runner must time out or be refused)
        run: |
          alb_dns="$(terraform -chdir=envs/preview output -raw alb_dns_name)"
          set +e
          http_code="$(curl --silent --show-error --max-time 10 --output /dev/null \
            --write-out '%{http_code}' "http://${alb_dns}/health")"
          curl_rc=$?
          set -e

          case "$curl_rc" in
            0)
              echo "runner received HTTP ${http_code}; ingress allowlist is not enforcing OPERATOR_CIDR" >&2
              exit 1
              ;;
            7|28)
              echo "runner connection was refused or timed out outside OPERATOR_CIDR (curl exit ${curl_rc})"
              ;;
            *)
              echo "negative ingress test failed for an unexpected curl error (exit ${curl_rc})" >&2
              exit 1
              ;;
          esac

      - name: Close on failure (stage 1)
        if: failure()
        env:
          OPERATOR_CIDR: ${{ secrets.OPERATOR_CIDR }}
          ENV_ID: ${{ inputs.env_id }}
          TARGET: aws
        run: scripts/close-env.sh "$ENV_ID"

      - name: Masked summary
        if: always()
        env:
          ENV_ID: ${{ inputs.env_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### session-apply"
            echo ""
            echo "env_id: $ENV_ID"
            echo "result: $JOB_STATUS"
            alb_url="$(terraform -chdir=envs/preview output -raw api_url 2>/dev/null || true)"
            if [[ -n "$alb_url" ]]; then
              echo "ALB URL: $alb_url"
            else
              echo "ALB URL: unavailable (apply did not leave readable state)"
            fi
          } | sed -E 's/[0-9]{12}/************/g' >> "$GITHUB_STEP_SUMMARY"
